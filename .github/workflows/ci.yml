name: CI
on:
  push:
  pull_request:
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Smoke test composite action with synthetic corpus
        uses: ./
        with:
          baseline: fixtures/bookshop/baseline.json
          candidate: fixtures/bookshop/baseline.json
          traces: fixtures/bookshop/traces
          test-suite: fixtures/bookshop/baseline.tests.json
      - run: node scripts/benchmark.js benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: driftglass-benchmark
          path: benchmark.json
